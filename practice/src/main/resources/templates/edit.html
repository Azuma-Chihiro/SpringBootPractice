<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>お問い合わせ編集</title>
</head>
<body>
	<h1>お問い合わせ編集</h1>
	<form th:action="@{/admin/contacts/{id}/edit(id = *{id})}" th:object="${contactForm}" method="post">
		
		<div th:if="${errorMessages}">
		    <ul>
		        <li th:each="error : ${errorMessages}" th:text="${error.defaultMessage}" style="color: red;"></li>
		    </ul>
		</div>
		
		<input type="text" th:field="*{id}" readonly>
		
		<table border="1">
				<tr>
					<td>姓</td>
					<td>
						<input type="text" th:field="*{lastName}">
						<span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" style="color: red"></span>
					</td>
				</tr>
				<tr>
					<td>名</td>
					<td>
						<input type="text" th:field="*{firstName}">
						<span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" style="color: red"></span>
					</td>
				</tr>
				<tr>
					<td>メールアドレス</td>
					<td>
						<input type="text" th:field="*{email}">
						<span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red"></span>
					</td>
				</tr>
				<tr>
					<td>電話番号</td>
					<td>
						<input type="text" th:field="*{phone}">
						<span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" style="color: red"></span>
					</td>
				</tr>
				<tr>
					<td>郵便番号</td>
					<td>
						<input type="text" th:field="*{zipCode}">
						<span th:if="${#fields.hasErrors('zipCode')}" th:errors="*{zipCode}" style="color: red"></span>
					</td>
				</tr>
			</tr>
			<tr>
				<td>住所</td>
				<td>
					<input type="text" th:field="*{address}">
					<span th:if="${#fields.hasErrors('address')}" th:errors="*{address}" style="color: red"></span>
				</td>
			</tr>
			<tr>
				<td>建物名</td>
				<td>
					<input type="text" th:field="*{buildingName}">
					<span th:if="${#fields.hasErrors('buildingName')}" th:errors="*{buildingName}" style="color: red"></span>
				</td>
			</tr>
			<tr>
				<td>お問い合わせ種別</td>
				<td>
					<select name="contactType">
						<option value="services">サービスに関するお問い合わせ</option>
						<option value="technicalQuestions">技術的なお問い合わせ</option>
						<option value="others">その他</option>
					</select>
					<span th:if="${#fields.hasErrors('contactType')}" th:errors="*{contactType}" style="color: red"></span>
				</td>
			</tr>
			<tr>
				<td>内容</td>
				<td>
					<input type="text" th:field="*{body}">
				</td>
			</tr>
			<tr>
				<td>作成日時</td>
				<td>
					<input type="text" th:field="*{created_at}" readonly>
				</td>
			</tr>
			<tr>
				<td>更新日時</td>
				<td>
					<input type="text" th:field="*{updated_at}" readonly>
					<span th:if="${#fields.hasErrors('body')}" th:errors="*{body}" style="color: red"></span>
				</td>
			</tr>
		</table>

			<input type="submit" value="保存">

	</form>
	
	<form th:action="@{/admin/contacts/{id}/delete(id = *{id})}" method="post">
		<input  type="submit" value="削除">
	</form>
		
	<a th:href="@{/admin/contacts}">一覧に戻る</a>

	<a th:href="@{/admin/signout}" class="btn btn-danger">ログアウト</a>
	
</body>
</html>
